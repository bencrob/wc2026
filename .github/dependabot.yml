version: 2

updates:
  # --- Dépendances npm ---
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      # Angular doit avancer en lockstep (core/common/compiler/cdk/material/build/cli…)
      angular:
        patterns:
          - "@angular/*"
          - "@angular-*/*"
          - "@angular-devkit/*"
      # Outils de dev / build (esbuild, vite, vitest, playwright, eslint, typescript…)
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      # Le reste des dépendances de prod en mises à jour mineures/patch groupées
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  # --- Actions GitHub (workflows) ---
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
