version: 2

updates:
  # --- Dépendances npm ---
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      # Outils de dev / build (esbuild, vite, vitest, playwright, eslint, typescript…)
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      # Le reste des dépendances de prod en mises à jour mineures/patch groupées
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
    # Angular est mis à jour via `ng update` (outil officiel Angular), pas par
    # Dependabot : core / compiler / compiler-cli / cli / material… doivent avancer
    # ENSEMBLE (compiler-cli exige compiler à la version exacte). Des bumps de patch
    # séparés cassent ce verrou (npm ci échoue) → on laisse Angular hors de Dependabot.
    ignore:
      - dependency-name: "@angular/*"
      - dependency-name: "@angular-devkit/*"

  # --- Actions GitHub (workflows) ---
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
