<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Pronoscup 2026</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Pronoscup 2026 : pronostics de la Coupe du Monde 2026 — saisissez vos scores, classements et tableau final calculés automatiquement, résultats officiels. Application installable et hors-ligne (PWA)."
    />
    <meta name="theme-color" content="#0a3d62" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Polices (Roboto, Material Icons) auto-hébergées via le build → offline réel -->
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- App-shell : peint immédiatement (avant le JS) → FCP/LCP rapides ; Angular le remplace -->
    <style>
      .app-splash {
        font-family: Roboto, system-ui, sans-serif;
        color: #0a3d62;
      }
      .app-splash__bar {
        position: sticky;
        top: 0;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: linear-gradient(135deg, #0a3d62, #074b78);
        color: #fff;
        font-weight: 700;
        font-size: 1.05rem;
        padding: 1rem;
      }
      .app-splash__bar img {
        height: 1.6rem;
        width: 1.6rem;
      }
      .app-splash__spinner {
        display: block;
        width: 40px;
        height: 40px;
        margin: 3.5rem auto;
        animation: app-splash-bounce 0.8s ease-in-out infinite;
      }
      @keyframes app-splash-bounce {
        0%,
        100% {
          transform: translateY(0) scale(1, 1);
        }
        50% {
          transform: translateY(-18px) scale(1.06, 0.94);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash__spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <wc-root>
      <div class="app-splash">
        <div class="app-splash__bar"><img src="favicon.svg" alt="" /> Pronoscup 2026</div>
        <img class="app-splash__spinner" src="ball.svg" alt="" role="status" aria-label="Chargement…" />
      </div>
    </wc-root>
    <noscript>Veuillez activer JavaScript pour utiliser Pronoscup 2026.</noscript>
  </body>
</html>
