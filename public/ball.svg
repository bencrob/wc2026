<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ballon de football">
  <defs>
    <!-- Ombrage sphérique (volume 3D) -->
    <radialGradient id="ball-sphere" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
    </radialGradient>
    <clipPath id="ball-clip">
      <circle cx="32" cy="32" r="29" />
    </clipPath>
  </defs>

  <!-- base blanche -->
  <circle cx="32" cy="32" r="29" fill="#ffffff" />

  <!-- panneaux colorés en moulinet (design original, couleurs festives 2026) -->
  <g clip-path="url(#ball-clip)">
    <path d="M32 32 L32 3 A29 29 0 0 1 57.1 46.5 Z" fill="#e8112d" />
    <path d="M32 32 L57.1 46.5 A29 29 0 0 1 6.9 46.5 Z" fill="#1e9bff" />
    <path d="M32 32 L6.9 46.5 A29 29 0 0 1 32 3 Z" fill="#0a8f4f" />

    <!-- coutures blanches -->
    <g stroke="#ffffff" stroke-width="2.4" stroke-linecap="round">
      <line x1="32" y1="32" x2="32" y2="3" />
      <line x1="32" y1="32" x2="57.1" y2="46.5" />
      <line x1="32" y1="32" x2="6.9" y2="46.5" />
    </g>

    <!-- moyeu central -->
    <circle cx="32" cy="32" r="6" fill="#ffffff" stroke="#15171a" stroke-width="1.2" />
    <circle cx="32" cy="32" r="2.4" fill="#15171a" />
  </g>

  <!-- volume + contour -->
  <circle cx="32" cy="32" r="29" fill="url(#ball-sphere)" />
  <circle cx="32" cy="32" r="29" fill="none" stroke="#15171a" stroke-width="2" />
</svg>
